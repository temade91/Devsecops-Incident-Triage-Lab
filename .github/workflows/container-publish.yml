name: Continuous Integration & Container Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Production Least-Privilege Scoping:
# DELIBERATE MISCONFIGURATION: packages: read instead of packages: write
permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  build-and-publish:
    name: Build, Scan & Push Hardened Image
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image Locally (For Scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: devsecops-lab:scan

      - name: Aqua Security Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devsecops-lab:scan'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}