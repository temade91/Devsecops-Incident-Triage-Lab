name: Secret Scanning Gate (TruffleHog)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog-scan:
    name: Audit Commits for Leaked Credentials
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner Environment
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          # Production requirement: fetch-depth: 0 ensures full historical commit traversal
          fetch-depth: 0

      - name: Run TruffleHog OSS Credential Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail